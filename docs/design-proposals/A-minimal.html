<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Förslag A – Minimal lista</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 Inter,system-ui,Segoe UI,sans-serif;background:#fff;color:#1c1f26}
header{border-bottom:1px solid #e8eaee;position:sticky;top:0;background:#fff;z-index:2}
.bar{max-width:760px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;letter-spacing:-.02em}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:8px;color:#5b6270;text-decoration:none;font-weight:500;font-size:15px}
nav a.on{color:#1c1f26;background:#f2f3f6}
main{max-width:760px;margin:0 auto;padding:28px 20px 100px}
h1{font-size:28px;letter-spacing:-.02em;font-weight:700}
.sub{color:#7a8190;margin:2px 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.f{display:flex;align-items:center;gap:7px;border:1px solid #e1e4ea;border-radius:999px;padding:6px 14px;font-size:14px;color:#3a4050;background:#fff}
.f.on{background:#1c1f26;color:#fff;border-color:#1c1f26}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a91a0;margin:24px 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #eef0f3}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #c9cdd6;flex:none}
.done .chk{background:#2f9e6f;border-color:#2f9e6f;position:relative}
.done .chk:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.done .t{text-decoration:line-through;color:#9aa1af}
.t{flex:1;font-weight:500}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:#7a8190}
.av{display:flex}.av span{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;margin-left:-6px;border:2px solid #fff}
.av span:first-child{margin-left:0}
.pts{font-size:13px;font-weight:600;color:#2f9e6f}
.fab{position:fixed;right:24px;bottom:24px;background:#1c1f26;color:#fff;border-radius:999px;padding:14px 22px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media(max-width:560px){.meta .cat{display:none}nav a{padding:8px 9px;font-size:14px}.logo{display:none}.bar{justify-content:center}}
</style></head><body>
<header><div class="bar"><span class="logo">FamiljeKoll</span>
<nav><a class="on">Idag</a><a>Vecka</a><a>Kommande</a><a>Familj</a></nav></div></header>
<main>
<h1>Idag</h1><p class="sub">Fredag 20 november · 3 av 5 klara</p>
<div class="filters">
<span class="f on">Alla</span>
<span class="f"><i class="dot" style="background:#e0694f"></i>Anna</span>
<span class="f"><i class="dot" style="background:#3b82c4"></i>Erik</span>
<span class="f"><i class="dot" style="background:#e2a336"></i>Lisa</span>
</div>
<h2>Att göra</h2>
<div class="row"><span class="chk"></span><span class="t">Byt däck på bilen</span><span class="meta"><span class="cat"><i class="dot" style="background:#8a63d2"></i> Bil</span><span class="av"><span style="background:#3b82c4">E</span></span></span></div>
<div class="row"><span class="chk"></span><span class="t">Ta med matlåda till utflykten</span><span class="meta"><span class="cat"><i class="dot" style="background:#2f9e6f"></i> Skola</span><span class="av"><span style="background:#e2a336">L</span></span></span></div>
<h2>Klart</h2>
<div class="row done"><span class="chk"></span><span class="t">Vattna blommorna</span><span class="meta"><span class="pts">+5</span><span class="cat"><i class="dot" style="background:#2f9e6f"></i> Hem</span><span class="av"><span style="background:#e0694f">A</span></span></span></div>
<div class="row done"><span class="chk"></span><span class="t">Städa köket</span><span class="meta"><span class="pts">+10</span><span class="cat"><i class="dot" style="background:#e0694f"></i> Hem</span><span class="av"><span style="background:#e0694f">A</span><span style="background:#3b82c4">E</span></span></span></div>
<div class="row done"><span class="chk"></span><span class="t">Ta ut soporna</span><span class="meta"><span class="pts">+3</span><span class="av"><span style="background:#e2a336">L</span></span></span></div>
</main><div class="fab">+ Ny aktivitet</div>
</body></html>
